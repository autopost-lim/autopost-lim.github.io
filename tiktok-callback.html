<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoPost Lim - Authorization</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6}textarea{width:100%;height:90px;font-family:monospace}button{padding:8px 16px;margin-top:8px}</style></head>
<body>
<h1>AutoPost Lim - TikTok authorization</h1>
<div id="out">Loading...</div>
<script>
var p=new URLSearchParams(location.search),o=document.getElementById('out');
if(p.get('error')){o.textContent='Error: '+p.get('error')+' '+(p.get('error_description')||'');}
else if(p.get('code')){o.innerHTML='<p>Authorization code (copy this, valid a few minutes):</p><textarea id="c" readonly></textarea><br><button onclick="var t=document.getElementById(\'c\');t.select();navigator.clipboard.writeText(t.value)">Copy</button><p>State: <span id="s"></span></p>';document.getElementById('c').value=p.get('code');document.getElementById('s').textContent=p.get('state')||'';}
else{o.textContent='No authorization code found.';}
</script>
</body></html>
